<!DOCTYPE html>
<html>
<head>
    <title>Детали Сообщения</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="mb-4">Детали сообщения</h1>
        <p>Тема сообщений: {{ message_detail.subject_message }}</p>
        <p>Сообщение: {{ message_detail.body_message }}</p>
        <a href="{% url 'services:message_edit' message_detail.pk %}" class="btn btn-secondary">Редактировать</a>
        <a href="{% url 'services:message_delete' message_detail.pk %}" class="btn btn-danger">Удалить</a>
        <a href="{% url 'services:message_list' %}" class="btn btn-primary">Вернуться к списку</a>
    </div>
    <script src="/static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
