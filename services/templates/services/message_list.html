
<!DOCTYPE html>
<html>
<head>
    <title>Список сообщений рассылок</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
         <a href="{% url 'services:mailing_list' %}" class="btn btn-primary mb-3">Главная страница</a>
        <h1 class="mb-4">Список сообщений рассылок</h1>
        <a href="{% url 'services:message_create' %}" class="btn btn-primary mb-3">Создать новое сообщение</a>
        <ul class="list-group">
            {% for mess in messages %}
                <li class="list-group-item">
                    <a href="{% url 'services:message_detail' mess.pk %}">{{ mess.email }} - {{ mess }} </a>
                    <a href="{% url 'services:message_edit' mess.pk %}" class="btn btn-sm btn-secondary ml-3">Редактировать</a>
                    <a href="{% url 'services:message_delete' mess.pk %}" class="btn btn-sm btn-danger ml-1">Удалить</a>
                </li>
            {% endfor %}
        </ul>
    </div>
    <script src="/static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
