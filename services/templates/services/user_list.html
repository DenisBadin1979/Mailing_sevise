<!-- services/user_list.html -->
{% extends 'services/base.html' %}
{% block content %}
<h2>Список пользователей</h2>
<table class="table">
    <thead>
        <tr>
            <th>Email</th>
            <th>Дата регистрации</th>
            <th>Активен</th>
            <th>Действия</th>
        </tr>
    </thead>
    <tbody>
        {% for user in users %}
        <tr>
            <td>{{ user.email }}</td>
            <td>{{ user.date_joined|date:"d.m.Y H:i" }}</td>
            <td>{{ user.is_active|yesno:"Да,Нет" }}</td>
            <td>
                <form method="post" action="{% url 'services:user_toggle_active' user.pk %}">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-{% if user.is_active %}warning{% else %}success{% endif %}">
                        {% if user.is_active %}Заблокировать{% else %}Разблокировать{% endif %}
                    </button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
